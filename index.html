<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>潘兵兵 & 贾金婷 婚礼邀请</title>
<meta name="description" content="潘兵兵与贾金婷的婚礼邀请函，诚邀您见证我们的幸福时刻。" />
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --bg: #f7f4ee;
    --bg-soft: #fbf9f4;
    --text: #2b2b2b;
    --text-soft: #6b6b6b;
    --gold: #b5915a;
    --gold-light: #d4b886;
    --line: #e6dfd2;
  }
  html, body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
  }
  h1, h2, h3 {
    font-family: "Playfair Display", "Times New Roman", "Noto Serif SC", serif;
    font-weight: 500;
    color: var(--text);
  }
  /* 花瓣画布 */
  #petalCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  /* 音乐按钮 */
  .music-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .music-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--gold);
  }
  .music-btn.playing .disc {
    animation: rotate 6s linear infinite;
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  /* 通用区块 */
  section {
    position: relative;
    z-index: 2;
    padding: 50px 22px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
  }
  /* 封面 */
  .cover {
    position: relative;
    height: 100vh;
    padding: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }
  .cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    loading: lazy;
  }
  .cover-mask {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(30, 24, 16, 0.55) 0%,
      rgba(30, 24, 16, 0.25) 45%,
      rgba(30, 24, 16, 0.08) 100%
    );
  }
  .cover-content {
    position: relative;
    z-index: 3;
    text-align: center;
    color: #fff;
    padding: 0 24px 70px;
    width: 100%;
  }
  .cover-content .en-title {
    font-size: 13px;
    letter-spacing: 6px;
    opacity: 0.85;
    margin-bottom: 14px;
  }
  .cover-content h1 {
    font-size: 34px;
    color: #fff;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .cover-content .date {
    font-size: 15px;
    letter-spacing: 3px;
    opacity: 0.9;
    margin-top: 18px;
  }
  .cover-line {
    width: 40px;
    height: 1px;
    background: var(--gold-light);
    margin: 16px auto;
  }
  /* 邀请正文 */
  .invitation {
    background: var(--bg-soft);
  }
  .section-title {
    text-align: center;
    margin-bottom: 30px;
  }
  .section-title .en {
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .section-title h2 {
    font-size: 24px;
    color: var(--text);
  }
  .section-title .line {
    width: 36px;
    height: 1px;
    background: var(--gold);
    margin: 14px auto 0;
  }
  .invitation-text {
    background: #fff;
    padding: 30px 24px;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.04);
  }
  .invitation-text p {
    font-size: 15px;
    color: var(--text-soft);
    margin-bottom: 16px;
    text-align: center;
  }
  .invitation-text p:last-child {
    margin-bottom: 0;
  }
  .signature {
    margin-top: 24px;
    font-family: "Playfair Display", "Times New Roman", serif;
    color: var(--gold);
    font-size: 16px;
    letter-spacing: 2px;
  }
  /* 相册区域（7张照片） */
  .album {
    background: var(--bg);
  }
  .album-img {
    width: 100%;
    border-radius: 14px;
    margin-bottom: 20px;
    display: block;
    loading: lazy;
  }
  /* 倒计时 */
  .countdown {
    background: var(--bg-soft);
    text-align: center;
  }
  .countdown-box {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
  }
  .countdown-item {
    min-width: 70px;
    padding: 18px 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
  }
  .countdown-item .num {
    font-family: "Playfair Display", serif;
    font-size: 28px;
    color: var(--gold);
  }
  .countdown-item .label {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 4px;
  }
</style>
</head>
<body>
<canvas id="petalCanvas"></canvas>

<!-- 音乐按钮 -->
<div class="music-btn" id="musicBtn">
  <svg class="disc" viewBox="0 0 24 24">
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
  </svg>
  <audio id="bgMusic" loop preload="none">
    <source src="./music.mp3" type="audio/mpeg">
  
</div>

<!-- 封面 -->
<section class="cover">
  <img src="./images/cover.jpg" alt="婚礼封面">
  <div class="cover-mask"></div>
  <div class="cover-content">
    <div class="en-title">WEDDING</div>
    <h1>潘兵兵 & 贾金婷</h1>
    <div class="cover-line"></div>
    <div class="date">诚邀您来见证我们的幸福</div>
  </div>
</section>

<!-- 邀请函文字 -->
<section class="invitation">
  <div class="container">
    <div class="section-title">
      <div class="en">INVITATION</div>
      <h2>邀请函</h2>
      <div class="line"></div>
    </div>
    <div class="invitation-text">
      <p>良辰已定，吉日待访</p>
      <p>吾有薄酒，以谢良友</p>
      <p>敬备喜筵，随候尊驾</p>
      <p>诚邀您见证我们的幸福时刻</p>
      <p class="signature">—— 潘兵兵 & 贾金婷</p>
    </div>
  </div>
</section>

<!-- 相册 7张照片 photo1 ~ photo7 -->
<section class="album">
  <div class="container">
    <div class="section-title">
      <div class="en">MEMORIES</div>
      <h2>我们的故事</h2>
      <div class="line"></div>
    </div>
    <img class="album-img" src="./images/photo1.jpg" alt="照片">
    <img class="album-img" src="./images/photo2.jpg" alt="照片">
    <img class="album-img" src="./images/photo3.jpg" alt="照片">
    <img class="album-img" src="./images/photo4.jpg" alt="照片">
    <img class="album-img" src="./images/photo5.jpg" alt="照片">
    <img class="album-img" src="./images/photo6.jpg" alt="照片">
    <img class="album-img" src="./images/photo7.jpg" alt="照片">
  </div>
</section>

<!-- 倒计时 -->
<section class="countdown">
  <div class="container">
    <div class="section-title">
      <div class="en">TIME</div>
      <h2>婚礼倒计时</h2>
      <div class="line"></div>
    </div>
    <div class="countdown-box">
      <div class="countdown-item">
        <div class="num" id="day">00</div>
        <div class="label">天</div>
      </div>
      <div class="countdown-item">
        <div class="num" id="hour">00</div>
        <div class="label">时</div>
      </div>
      <div class="countdown-item">
        <div class="num" id="min">00</div>
        <div class="label">分</div>
      </div>
      <div class="countdown-item">
        <div class="num" id="sec">00</div>
        <div class="label">秒</div>
      </div>
    </div>
  </div>
</section>

<script>
// 音乐控制
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
musicBtn.addEventListener('click', ()=>{
  if(bgMusic.paused){
    bgMusic.play();
    musicBtn.classList.add('playing');
  }else{
    bgMusic.pause();
    musicBtn.classList.remove('playing');
  }
});

// ========== 倒计时 ==========
// 修改这里为你的婚礼时间：年,月-1,日,时,分,秒
const weddingTime = new Date(2026, 11, 29, 11, 55, 0).getTime();
function updateCountdown(){
  const now = Date.now();
  const diff = weddingTime - now;
  if(diff <= 0){
    document.getElementById('day').innerText = '00';
    document.getElementById('hour').innerText = '00';
    document.getElementById('min').innerText = '00';
    document.getElementById('sec').innerText = '00';
    return;
  }
  const day = Math.floor(diff / (1000*60*60*24));
  const hour = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const min = Math.floor((diff % (1000*60*60)) / (1000*60));
  const sec = Math.floor((diff % (1000*60)) / 1000);
  document.getElementById('day').innerText = String(day).padStart(2,'0');
  document.getElementById('hour').innerText = String(hour).padStart(2,'0');
  document.getElementById('min').innerText = String(min).padStart(2,'0');
  document.getElementById('sec').innerText = String(sec).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

// ========== 花瓣动画（优化版） ==========
window.addEventListener('DOMContentLoaded', ()=>{
  const canvas = document.getElementById('petalCanvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  const petalList = [];
  const MAX_PETAL = 28;
  const petalColor = '#d4b886';

  let resizeTimer = null;
  function resize(){
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
  }
  resize();
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize,120);
  });

  class Petal{
    constructor(){
      this.reset();
    }
    reset(){
      this.x = Math.random() * w;
      this.y = Math.random() * -h;
      this.size = Math.random() * 6 + 3;
      this.speedY = Math.random() * 0.6 + 0.25;
      this.speedX = (Math.random()-0.5)*0.4;
      this.rot = Math.random()*Math.PI*2;
      this.rotSpeed = (Math.random()-0.5)*0.022;
      this.opacity = Math.random()*0.35 + 0.35;
    }
    update(){
      this.y += this.speedY;
      this.x += this.speedX;
      this.rot += this.rotSpeed;
      if(this.y > h + 12) this.reset();
    }
    draw(){
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillStyle = petalColor;
      ctx.globalAlpha = this.opacity;
      ctx.beginPath();
      ctx.moveTo(0, -this.size);
      ctx.bezierCurveTo(
        this.size*0.55, -this.size*0.35,
        this.size*0.55, this.size*0.35,
        0, this.size
      );
      ctx.bezierCurveTo(
        -this.size*0.55, this.size*0.35,
        -this.size*0.55, -this.size*0.35,
        0, -this.size
      );
      ctx.fill();
      ctx.restore();
    }
  }

  for(let i=0;i<MAX_PETAL;i++) petalList.push(new Petal());

  function render(){
    ctx.clearRect(0,0,w,h);
    for(let p of petalList){
      p.update();
      p.draw();
    }
    requestAnimationFrame(render);
  }
  render();
})
</script>
</body>
</html>
